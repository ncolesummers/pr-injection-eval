[project]
name = "pr-injection-eval"
version = "0.1.0"
description = "A small Inspect eval: prompt injection against a code review agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.289",
    "anthropic",
    "openai",
    "google-genai>=3.3.0",
]

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_injection_eval"]

[tool.ruff]
line-length = 88
target-version = "py311"
# The fixtures are data: small repositories for the agent to review, some
# with deliberate bugs. They must stay byte-for-byte as they are.
extend-exclude = ["src/pr_injection_eval/fixtures"]

[tool.ruff.lint]
# E/F: basic errors, I: import order, UP: modern syntax, B: likely bugs,
# ANN: every function signature must carry type hints.
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
# PR descriptions and one-line planted comments read better unwrapped.
"src/pr_injection_eval/dataset.py" = ["E501"]
# Table rows read better on one line.
"scripts/summarize.py" = ["E501"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["src/pr_injection_eval/fixtures"]
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
