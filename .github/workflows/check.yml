name: check

on:
  push:
  pull_request:

# This job only reads the code. It gets no write access and no secrets.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      # Same command as local development. No API keys: no test calls a model.
      - run: scripts/check.sh
